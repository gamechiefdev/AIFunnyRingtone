android {
    namespace 'com.gamechief.aifunnyringtone'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.gcl.funnyringtone.aiwallpapers.airingtones.superfunny"
        minSdk 23
        targetSdk 36
        versionCode 6
        versionName "6.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def contentProviderAuthority = applicationId + ".StickerPack.StickerContentProvider"
        // Creates la placeholder property to use in the manifest.
        manifestPlaceholders = [contentProviderAuthority: contentProviderAuthority]
        // Adds la new field for the authority to the BuildConfig class.
        buildConfigField("String", "CONTENT_PROVIDER_AUTHORITY", "\"${contentProviderAuthority}\"")
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

